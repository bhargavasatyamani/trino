# Neo4j Connector Configuration
connector.name=neo4j

# Connection settings
neo4j.uri=bolt://localhost:7687
neo4j.username=neo4j
neo4j.password=password
neo4j.database=neo4j

# Connection pool settings (optional)
neo4j.max-connection-pool-size=100
neo4j.connection-timeout=30s
neo4j.max-connection-lifetime=3600s
neo4j.max-connection-idle-time=600s

# Query settings (optional)
neo4j.case-insensitive-name-matching=false
neo4j.dynamic-filtering.wait-timeout=5s
